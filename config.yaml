versao: "2.0"

paths:
  project_root: "."
  input_root: "input"
  output_root: "output"
  backup_root: "backup"
  log_root: "logs"

inputs:
  pp:
    project_patterns:
      - "*PROJETO COMPLETO*.csv"
      - "*PROJETO COMPLETO*.xlsx"
      - "*PROJETO COMPLETO*.xlsm"
    final_patterns:
      - "*CONFIG FINAL*.csv"
      - "*CONFIG FINAL*.xlsx"
      - "*CONFIG FINAL*.xlsm"
    plan_pdf_patterns:
      - "PP*.pdf"
      - "PP.pdf"
    histo_patterns:
      - "HISTO-*.txt"
      - "HISTO-*.log"
      - "*_histo.log"

business:
  output_type_label: "producao"
  # O Config Final define os furos realizados; nao remover seus IDs porque
  # o Projeto Completo marcou o registro como eliminated.
  include_eliminated: true
  plan_id_source: "auto"
  plan_id_regex: "(?:pp)?(\\d{6,8}(?:[_-][A-Z])?)"
  fallback_plan_id: "320526"
  allow_unmatched_plan_fire_fallback: true
  redistribute_zero_charges: true
  charge_total_target_kg: 17136.048
  charge_zero_fill_min_kg: 0.01
  output_name_template: "Plano_Fogo_Realizado_PP{plan_id}.xlsx"
  data_sheet_name: "Dados dos Furos"
  summary_sheet_name: "Resumo"
  use_final_detonating_time_as_is: true
  fill_missing_detonating_time: true
  simulate_stemming_variation: true
  simulate_stemming_variation_max: 0.12
  # Importação do BREX (BMO) no site: o relógio do BMO grava em UTC; -3 converte para Brasília.
  # Espelhado em public/config.js (window.PFR_BROWSER_CONFIG.business); tests/test_brex_config.py verifica a igualdade.
  brex_offset_hours: -3
  brex_offset_min_hours: -12
  brex_offset_max_hours: 14
  # Identificação do plano no site: ID digitado (número ou nome) é gravado como digitado.
  # Sem ID digitado ou nos anexos, usa o nome do PDF/planilha (sem termos genéricos) e,
  # por último, gera um ID com este prefixo e a data/horário do disparo (aviso no resultado).
  # Espelhado em public/config.js; tests/test_browser_config.py verifica a igualdade.
  plan_label_fallback_prefix: "PFR"
  plan_label_max_length: 60
  plan_label_generic_names:
    - "pp"
    - "pdf"
    - "plano"
    - "plano de perfuracao"
    - "plano de fogo"
    - "plano de fogo realizado"
    - "plano realizado"
    - "copia"
    - "modelo"
    - "historial da bmo"
    - "projeto completo"
    - "config final"
    - "configuracao final"
  output_name_text_template: "Plano_Fogo_Realizado_{plan_label}.xlsx"

validation:
  required_project_columns:
    - "Number"
    - "UTM_X"
    - "UTM_Y"
    - "Length_m"
    - "Stemming_m"
    - "Diameter_mm"
    - "Subdrilling_m"
    - "Angle_deg"
    - "Azimuth_deg"
    - "Total_Charge_kg"
  required_final_columns:
    - "Number"
    - "X"
    - "Y"
    - "Z"
    - "X_Toe"
    - "Y_Toe"
    - "Z_Toe"
    - "Length"
    - "Stemming"
    - "Diameter"
    - "Subdrilling"
    - "Angle"
    - "Azimuth"
    - "DetonatingTime"
    - "InputedCharge"
  charge_amplification_tolerance: 0.02
  total_deviation_tolerance: 0.02

export:
  decimal_places_coordinates: 4
  decimal_places_values: 1
  decimal_places_charge: 2
  decimal_places_stemming_realized: 1

logging:
  level: "INFO"
  file_template: "geracao_{date}.log"
  console: true
